project_id = "kokjipseo"

# Verification is performed in each handler with Auth /user (supports publishable keys).
# Requests without a valid signed-in user are rejected BEFORE external calls.
[functions.recipes]
verify_jwt = false
[functions.ocr]
verify_jwt = false
[functions.recognize]
verify_jwt = false

# User JWT is verified with Auth /user inside the handler.
[functions.email-verification]
verify_jwt = false
# Server only; validates x-cron-secret. Never accepts an ordinary browser session as authorization.
[functions.email-reminder-worker]
verify_jwt = false
